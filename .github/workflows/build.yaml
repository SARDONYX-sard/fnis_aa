name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xmake
        id: xmake
        with:
          cache-key: build
          plugin-name: true

      - name: Build
        run: xmake build -y ${{ steps.xmake.outputs.plugin-name }}
      - name: Install
        run: xmake install -o ./build/artifact ${{ steps.xmake.outputs.plugin-name }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.xmake.outputs.plugin-name }}
          path: |
            ./build/artifact/**
