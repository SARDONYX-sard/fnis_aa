name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xmake
        id: xmake
        with:
          cache-key: test

      - name: Test
        run: xmake test
