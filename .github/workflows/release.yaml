name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-xmake
        id: xmake
        with:
          cache-key: release
          plugin-name: true

      # Build, install and zip as build/<plugin>-windows.zip
      - name: Build release zip
        run: xmake release-zip

      - name: Create GitHub Release (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create `
            "${{ github.ref_name }}" `
            "build/${{ steps.xmake.outputs.plugin-name }}-windows.zip" `
            --title "${{ steps.xmake.outputs.plugin-name }} ${{ github.ref_name }}" `
            --generate-notes
