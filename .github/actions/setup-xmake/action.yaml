name: Setup xmake
description: Install xmake (with cache) and optionally resolve the SKSE plugin target name.

inputs:
  cache-key:
    description: Suffix of the xmake actions cache key (e.g. build, release).
    required: false
    default: build
  plugin-name:
    description: Resolve the plugin target name with `xmake plugin-name`
    required: false
    default: "false"

outputs:
  plugin-name:
    description: SKSE plugin target name (empty unless `inputs.plugin-name` is true).
    value: ${{ steps.plugin.outputs.PLUGIN_NAME }}

runs:
  using: composite
  steps:
    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "3.1.2"
        actions-cache-folder: ".xmake-cache"
        actions-cache-key: ${{ runner.os }}-xmake-${{ inputs.cache-key }}-cache-

    - name: Get plugin name
      if: ${{ inputs.plugin-name == 'true' }}
      id: plugin
      shell: pwsh
      run: |
        $name = xmake plugin-name
        if ($LASTEXITCODE -ne 0) { exit 1 }
        "PLUGIN_NAME=$name" >> $env:GITHUB_OUTPUT
